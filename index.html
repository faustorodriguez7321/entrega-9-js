<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfumeria Soffredini</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/styles.css">
    <script defer src="js/main.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
        <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Lavishly+Yours&family=PT+Serif:ital,wght@0,400;0,700;1,400;1,700&display=swap"
        rel="stylesheet">

</head>

<body>
    <header>
        <h1>Perfumeria Soffredini</h1>
    </header>


    <main>
        <section>
            <h2>Agregar perfume</h2>
            <div>
                <input type="text" id="nombre" placeholder="Nombre">
                <input type="number" id="precio" placeholder="Precio">
                <input type="number" id="stock" placeholder="Stock">
                <button class="btn" id="btn-agregar">+ Agregar</button>
                <button class="btn btn-eliminar" id="btn-restablecer">Restablecer</button>
            </div>
        </section>

        <section>
            <h2>Buscar perfume</h2>
            <div>
                <input type="text" id="buscador" placeholder="Escriba el nombre">
            </div>
        </section>

        <p id="aviso"></p>

        <p id="mensaje"></p>

        <div id="contenedor"></div>
    </main>

    <footer>

    </footer>

</body>

</html>
